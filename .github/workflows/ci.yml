name: Portability checks
on:
  push:
    branches: [main, codex/macos-portability]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Check (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
        node: ["22.12.0", "24"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
  smoke:
    name: Electron smoke (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AGENT_BROKER_SMOKE_SCREENSHOT: /tmp/agent-broker-smoke.png
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y xvfb xauth dbus-x11 libgtk-3-0 libnss3 libasound2t64
      - run: npm ci
      - run: npm run smoke:linux
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: smoke-linux
          path: ${{ runner.temp }}/agent-broker-smoke.png
          if-no-files-found: ignore
