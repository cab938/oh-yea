name: Portability checks
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Check (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
        node: ["22.12.0", "24"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
  smoke:
    name: Electron smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      AGENT_BROKER_SMOKE_SCREENSHOT: output/smoke/screenshot.png
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth dbus-x11 libgtk-3-0 libnss3 libasound2t64
      - run: npm ci
      - run: npx install-electron --no
      - name: Run native fixture and lifecycle tests
        shell: bash
        run: |
          mkdir -p output/smoke
          if [ "$RUNNER_OS" = Linux ]; then
            npm run smoke:linux 2>&1 | tee output/smoke/run.log
          else
            npm run smoke:macos 2>&1 | tee output/smoke/run.log
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: smoke-${{ matrix.os }}
          path: output/smoke/
          if-no-files-found: ignore
