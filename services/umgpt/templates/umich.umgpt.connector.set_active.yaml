# Disabled operator template. Use the same configured origin as umgpt_session.
name: umich.umgpt.connector.set_active
service: umgpt
description: Enable or disable one installed connector for the entire UM GPT account and verify its state
enabled: false
authentication: umgpt_session
action:
  type: umgpt_connector_state
  page_url: https://umgpt.example.test/
contract:
  input_schema:
    type: object
    additionalProperties: false
    required:
      - connector_id
      - is_active
    properties:
      connector_id:
        type: integer
        minimum: 1
      is_active:
        type: boolean
  output_schema:
    type: object
    additionalProperties: false
    required:
      - connector
      - changed
    properties:
      changed:
        type: boolean
      connector:
        type: object
        additionalProperties: false
        required:
          - id
          - display_name
          - description
          - is_active
          - tool_count
        properties:
          id:
            type: integer
            minimum: 1
          display_name:
            type: string
          description:
            type:
              - string
              - "null"
          is_active:
            type: boolean
          tool_count:
            type:
              - integer
              - "null"
            minimum: 0
